<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ラスアタ練習時計 PC版</title>
<style>
  :root {
    --bg: #0b0b0f;
    --panel: #15151c;
    --text: #ffffff;
    --sub: #b9b9c7;
    --accent: #ff4f7a;
    --accent2: #7ad7ff;
    --border: #2b2b36;
    --gauge-bg: #2a2a35;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap {
    width: min(960px, 96vw);
    padding: 24px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
  }
  .title {
    font-size: 18px;
    color: var(--sub);
    margin-bottom: 10px;
    letter-spacing: .08em;
  }
  .clock {
    font-variant-numeric: tabular-nums;
    font-size: clamp(58px, 11vw, 118px);
    font-weight: 800;
    text-align: center;
    line-height: 1;
    letter-spacing: .02em;
    margin: 18px 0 18px;
  }
  .gauge-wrap {
    width: 100%;
    height: 28px;
    background: var(--gauge-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 28px;
    position: relative;
  }
  .gauge-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    transition: width 0.02s linear;
  }
  .gauge-labels {
    display: flex;
    justify-content: space-between;
    color: var(--sub);
    font-size: 12px;
    margin-top: -20px;
    margin-bottom: 24px;
    padding: 0 4px;
  }
  .timer-box {
    border-top: 1px solid var(--border);
    padding-top: 22px;
  }
  .timer-label {
    color: var(--sub);
    font-size: 15px;
    text-align: center;
    margin-bottom: 8px;
  }
  .timer {
    font-variant-numeric: tabular-nums;
    font-size: clamp(38px, 7vw, 72px);
    font-weight: 800;
    text-align: center;
    margin-bottom: 20px;
  }
  .buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  button {
    appearance: none;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 12px;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    background: #20202a;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.12); }
  button:active { transform: translateY(1px); }
  .start { background: var(--accent); border-color: transparent; }
  .stop { background: #3a3a47; }
  .reset { background: #20202a; }
  .hint {
    color: var(--sub);
    font-size: 13px;
    text-align: center;
    margin-top: 16px;
    line-height: 1.6;
  }
  .result {
    text-align: center;
    margin-top: 16px;
    font-size: 18px;
    min-height: 1.5em;
    color: #ffd37a;
  }
  @media (max-width: 600px) {
    .wrap { padding: 10px; }
    .card { padding: 18px; border-radius: 14px; }
    .buttons { grid-template-columns: 1fr; }
    .gauge-wrap { height: 22px; }
  }
</style>
</head>
<body>
<a href="index.html" style="position:fixed;top:10px;left:10px;z-index:9999;color:#fff;background:#22232d;border:1px solid #3a3a47;border-radius:10px;padding:8px 12px;text-decoration:none;font:600 14px sans-serif;">← 入口へ</a>
  <div class="wrap">
    <div class="card">
      <div class="title">現在時刻</div>
      <div class="clock" id="clock">00:00:00</div>

      <div class="gauge-wrap" aria-label="1秒ゲージ">
        <div class="gauge-fill" id="gaugeFill"></div>
      </div>
      <div class="gauge-labels">
        <span>0.00</span>
        <span>0.50</span>
        <span>0.99</span>
      </div>

      <div class="timer-box">
        <div class="timer-label">リロード開始 → 盗む までの経過時間</div>
        <div class="timer" id="timer">0.00 秒</div>

        <div class="buttons">
          <button class="start" id="startBtn">START</button>
          <button class="stop" id="stopBtn">STOP</button>
          <button class="reset" id="resetBtn">RESET</button>
        </div>

        <div class="result" id="result"></div>

        <div style="margin-top:18px; border-top:1px solid var(--border); padding-top:18px;">
          <div class="timer-label">Spaceキーで押した瞬間を記録</div>
          <div id="records" style="
            background:#101017;
            border:1px solid var(--border);
            border-radius:12px;
            padding:12px;
            max-height:220px;
            overflow:auto;
            font-variant-numeric:tabular-nums;
            line-height:1.8;
            min-height:52px;
          ">まだ記録はありません</div>
          <button id="clearRecordsBtn" style="margin-top:10px; width:100%;">記録を消去</button>
        </div>

        <div class="hint">
          キーボード操作：Space = 現在時刻を記録 / S = STOP / R = RESET<br>
          ゲージは1秒ごとに左から右へ進み、次の秒でリセットされます。<br>
          現在時刻はPC・スマホ本体の時計を使用します。
        </div>
      </div>
    </div>
  </div>

<script>
  const clockEl = document.getElementById('clock');
  const gaugeFill = document.getElementById('gaugeFill');
  const timerEl = document.getElementById('timer');
  const resultEl = document.getElementById('result');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const resetBtn = document.getElementById('resetBtn');
  const recordsEl = document.getElementById('records');
  const clearRecordsBtn = document.getElementById('clearRecordsBtn');
  let records = [];

  let running = false;
  let startPerf = 0;
  let elapsed = 0;

  function pad2(n) {
    return String(n).padStart(2, '0');
  }

  function updateClock() {
    const now = new Date();
    const h = pad2(now.getHours());
    const m = pad2(now.getMinutes());
    const s = pad2(now.getSeconds());
    const ms = now.getMilliseconds();

    clockEl.textContent = `${h}:${m}:${s}`;
    gaugeFill.style.width = `${(ms / 1000) * 100}%`;

    requestAnimationFrame(updateClock);
  }

  function updateTimer() {
    if (running) {
      elapsed = (performance.now() - startPerf) / 1000;
      timerEl.textContent = `${elapsed.toFixed(2)} 秒`;
    }
    requestAnimationFrame(updateTimer);
  }

  function startTimer() {
    elapsed = 0;
    startPerf = performance.now();
    running = true;
    resultEl.textContent = '';
  }

  function stopTimer() {
    if (!running) return;
    elapsed = (performance.now() - startPerf) / 1000;
    running = false;
    timerEl.textContent = `${elapsed.toFixed(2)} 秒`;
    resultEl.textContent = `今回：${elapsed.toFixed(2)} 秒`;
  }

  function resetTimer() {
    running = false;
    elapsed = 0;
    timerEl.textContent = '0.00 秒';
    resultEl.textContent = '';
  }

  function recordCurrentTime() {
    const now = new Date();
    const h = pad2(now.getHours());
    const m = pad2(now.getMinutes());
    const s = pad2(now.getSeconds());
    const hs = pad2(Math.floor(now.getMilliseconds() / 10));
    records.push(`${h}:${m}:${s}.${hs}`);
    recordsEl.innerHTML = records.map((t, i) => `<div>${i + 1}回目　${t}</div>`).join('');
    recordsEl.scrollTop = recordsEl.scrollHeight;
  }

  function clearRecords() {
    records = [];
    recordsEl.textContent = 'まだ記録はありません';
  }

  startBtn.addEventListener('click', startTimer);
  stopBtn.addEventListener('click', stopTimer);
  resetBtn.addEventListener('click', resetTimer);
  clearRecordsBtn.addEventListener('click', clearRecords);

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      recordCurrentTime();
    } else if (e.key.toLowerCase() === 's') {
      stopTimer();
    } else if (e.key.toLowerCase() === 'r') {
      resetTimer();
    }
  });

  updateClock();
  updateTimer();
</script>
</body>
</html>
