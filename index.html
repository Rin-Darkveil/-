<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ラスアタ練習時計</title>
<meta name="description" content="血盟戦ラスアタ練習用。PC版とAndroid PiP版を選べます。">
<style>
:root{
  --bg:#0b0b0f;--panel:#15151c;--text:#fff;--sub:#b9b9c7;
  --border:#2b2b36;--accent:#ff4f7a;--accent2:#7ad7ff;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:"Segoe UI","Yu Gothic UI","Meiryo",sans-serif;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.wrap{width:min(860px,96vw)}
.card{
  background:var(--panel);border:1px solid var(--border);
  border-radius:20px;padding:28px;box-shadow:0 12px 40px rgba(0,0,0,.35);
}
h1{margin:0 0 10px;font-size:clamp(28px,5vw,44px)}
.lead{color:var(--sub);line-height:1.7;margin:0 0 24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
a.choice{
  display:block;text-decoration:none;color:var(--text);
  background:#101017;border:1px solid var(--border);
  border-radius:18px;padding:22px;transition:.15s ease;
}
a.choice:hover{transform:translateY(-2px);filter:brightness(1.08)}
.icon{font-size:34px;margin-bottom:10px}
.title{font-size:24px;font-weight:800;margin-bottom:8px}
.desc{color:var(--sub);line-height:1.6;font-size:15px}
.badge{
  display:inline-block;margin-top:14px;padding:6px 10px;border-radius:999px;
  font-size:12px;font-weight:700;background:#20202a;color:#fff;
}
.pc{border-color:#3b4254}
.pip{border-color:#4a3550}
.note{
  margin-top:18px;color:var(--sub);font-size:13px;line-height:1.6;
  border-top:1px solid var(--border);padding-top:16px;
}
@media(max-width:700px){.grid{grid-template-columns:1fr}.card{padding:20px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>ラスアタ練習時計</h1>
    <p class="lead">使う端末に合わせて選んでね。</p>

    <div class="grid">
      <a class="choice pc" href="pc.html">
        <div class="icon">🖥️</div>
        <div class="title">PC練習版</div>
        <div class="desc">
          1秒ゲージ、ストップウォッチ、Spaceキーで押した瞬間の時刻記録つき。
        </div>
        <span class="badge">PC向け</span>
      </a>

      <a class="choice pip" href="pip.html">
        <div class="icon">📱</div>
        <div class="title">Android PiP版</div>
        <div class="desc">
          時計＋1秒ゲージをPicture-in-Pictureの小窓で表示する実験版。
        </div>
        <span class="badge">Android向け</span>
      </a>
    </div>

    <div class="note">
      ※ PiP版は端末・ブラウザによって挙動が異なります。コンマ秒の厳密な基準として使う前に、自分の環境で表示ズレを確認してください。
    </div>
  </div>
</div>
</body>
</html>
